name: Build Apple Silicon
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Chromaprint
        run: brew install chromaprint
      - name: Compile and package
        run: |
          set -euo pipefail
          APP="$PWD/dist/EchoSweep.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/bin" "$APP/Contents/Frameworks"
          cp Info.plist "$APP/Contents/Info.plist"
          swift scripts/create_icon.swift "$PWD/EchoSweep.iconset"
          iconutil -c icns "$PWD/EchoSweep.iconset" -o "$APP/Contents/Resources/EchoSweep.icns"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string EchoSweep" "$APP/Contents/Info.plist"
          xcrun swiftc -parse-as-library -O -target arm64-apple-macos15.0 Sources/main.swift -o "$APP/Contents/MacOS/EchoSweep"
          cp "$(brew --prefix chromaprint)/bin/fpcalc" "$APP/Contents/Resources/bin/fpcalc"
          python3 scripts/bundle_dylibs.py "$APP/Contents/Resources/bin/fpcalc" "$APP/Contents/Frameworks"
          find "$APP/Contents/Frameworks" -type f -exec codesign --force --sign - {} \;
          codesign --force --sign - "$APP/Contents/Resources/bin/fpcalc"
          codesign --force --sign - "$APP/Contents/MacOS/EchoSweep"
          codesign --force --sign - "$APP"
          cd dist && ditto -c -k --keepParent EchoSweep.app EchoSweep-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EchoSweep-arm64
          path: dist/EchoSweep-arm64.zip
